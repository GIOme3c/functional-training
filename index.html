<title>Функциональный тренинг — майнд-карта (конспект Маши)</title>
<style>
:root{--ink:#263238;--muted:#607d8b;--line:#e3e8ec;--panel:#ffffff;--bgc:#f6f8fa;--accent:#37474f;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;font-family:"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",Arial,sans-serif;color:var(--ink);background:var(--bgc)}
body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04);z-index:5}
.brand h1{font-size:17px;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto}
.more-btn{display:none}
button,.btn{font:inherit;font-size:13px;border:1px solid #cfd8dc;background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.1;-webkit-tap-highlight-color:transparent;min-height:36px}
button:hover{background:#eceff1}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #1565c0;outline-offset:2px}
select{font:inherit;font-size:13px;border:1px solid #cfd8dc;border-radius:8px;padding:5px 6px;background:#fff}
.search{display:flex;align-items:center;gap:4px;border:1px solid #cfd8dc;border-radius:8px;padding:2px 4px 2px 8px;background:#fff}
.search input{border:0;outline:0;font:inherit;font-size:16px;width:210px;padding:4px 0;background:transparent}
.search .cnt{font-size:12px;color:var(--muted);min-width:52px;text-align:right}
.search button{border:0;padding:4px 6px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
main{flex:1;display:flex;min-height:0;position:relative}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:
 radial-gradient(circle at 1px 1px,#dfe5ea 1px,transparent 0) 0 0/22px 22px}
#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.node{position:absolute;left:0;top:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.35;max-width:330px;width:max-content;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,opacity .15s;animation:pop .18s ease-out;white-space:normal;overflow-wrap:anywhere;user-select:text;-webkit-tap-highlight-color:rgba(21,101,192,.18);-webkit-touch-callout:none}
@keyframes pop{from{opacity:0}to{opacity:1}}
.node:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.node:focus{outline:none}
.node.sel{box-shadow:0 0 0 3px rgba(21,101,192,.45),0 2px 8px rgba(0,0,0,.15)}
.node.l0{font-size:19px;font-weight:700;color:#fff;background:#37474f;border:0;border-radius:22px;padding:14px 22px;max-width:300px;text-align:center}
.node.l1{font-size:16px;font-weight:700;border:2px solid var(--c);background:var(--bg);color:var(--c);border-radius:14px;padding:9px 14px;max-width:230px}
.node.l2{font-weight:600;background:var(--bg);border-color:var(--c);max-width:260px}
.node.l3,.node.l4,.node.l5{border-left:3px solid var(--c)}
.node.mus{max-width:400px}
.node .lbl{font-weight:700}
.node .src{display:inline-block;margin-top:4px;font-size:11px;color:#546e7a;background:#eceff1;border-radius:6px;padding:1px 6px;font-weight:400}
.node .sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:400}
.node img.pic{display:block;margin-top:6px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;cursor:zoom-in}
.node a.lnk{margin-left:6px;font-size:12px;text-decoration:none;color:#1565c0;white-space:nowrap;font-weight:400}
.node a.lnk:hover{text-decoration:underline}
.fold{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#fff;border:2px solid var(--c);color:var(--c);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;user-select:none;min-height:22px}
.side-r .fold{right:-13px}.side-l .fold{left:-13px}
.l0 .fold{display:none}
.node.dim{opacity:.35}
.node.hit{opacity:1;box-shadow:0 0 0 2px #ffb300}
.node.hit.cur{box-shadow:0 0 0 4px #ff6f00,0 4px 14px rgba(0,0,0,.2)}
mark{background:#ffe082;color:inherit;border-radius:2px;padding:0 1px}
aside{flex:none;width:380px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px;font-size:14px;line-height:1.45}
aside.hidden{display:none}
aside h2{font-size:16px;margin:6px 0 8px}
aside .crumbs{font-size:12px;color:var(--muted)}
aside .crumbs a{color:var(--muted);cursor:pointer;text-decoration:none}
aside .crumbs a:hover{color:#1565c0;text-decoration:underline}
aside table{border-collapse:collapse;font-size:13px;margin:6px 0}
aside td{padding:2px 8px 2px 0;vertical-align:top}
aside img{max-width:100%;border-radius:8px;border:1px solid #e0e0e0;cursor:zoom-in;margin:6px 0}
aside ul{padding-left:18px;margin:6px 0}
aside li{margin:3px 0}
aside ul.deep ul.deep{padding-left:16px;border-left:2px solid #eceff1;margin:3px 0}
aside .srcp{font-size:11px;color:#546e7a;background:#eceff1;border-radius:6px;padding:1px 6px;white-space:nowrap}
aside li a{cursor:pointer;color:inherit;text-decoration:none}
aside li a:hover{text-decoration:underline;color:#1565c0}
aside .acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
aside .help{background:#f5f7f9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
aside .help h3{margin:0 0 6px;font-size:14px}
aside .help ul{margin:0;padding-left:18px}
kbd{font-family:inherit;font-size:11px;border:1px solid #cfd8dc;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#263238e6;color:#fff;font-size:13px;padding:7px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}#toast.on{opacity:1}
#zoomui{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:4px;z-index:3}
#zoomui button{background:#fffd;width:34px;padding:6px 0;min-height:36px}
#lightbox{position:fixed;inset:0;background:rgba(20,28,34,.82);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;flex-direction:column;gap:10px}
#lightbox.on{display:flex}
#lightbox img{max-width:94vw;max-height:86dvh;border-radius:10px;background:#fff}
#lightbox div{color:#fff;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.panel-handle{display:none}.peek{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));pointer-events:none}
.peek.on{display:block}
.peek button{pointer-events:auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:12px 16px max(14px,env(safe-area-inset-bottom));font-size:15px;min-height:52px;text-align:left}
.peek .ttl{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.peek .hint{color:#1565c0;font-weight:600;flex:none;white-space:nowrap}
.panel-close{display:none}
@media (max-width:920px),(pointer:coarse) and (max-width:1180px){
  header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));align-items:center}
  .brand{min-width:0;grid-column:1;grid-row:1}
  .brand h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{display:none}
  .legend{display:none}
  .more-btn{display:inline-flex;grid-column:2;grid-row:1;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:6px 10px;font-size:14px}
  #togglePanel{grid-column:3;grid-row:1;min-height:40px;margin:0}
  .tools{grid-column:1/-1;grid-row:2;width:100%;margin:0;gap:6px}
  .search{display:flex;flex:1 1 100%;width:100%;min-width:0;padding:2px 4px 2px 10px}
  .search input{flex:1 1 auto;width:auto;min-width:0;font-size:16px}
  #level,#expandAll,#collapseAll{display:none;flex:1 1 calc(50% - 6px);min-height:40px}
  #level{flex:1 1 100%}
  header.more-open #level,header.more-open #expandAll,header.more-open #collapseAll{display:inline-flex;align-items:center;justify-content:center}
  header.more-open #level{display:block}
  header.more-open .tools{grid-row:2}
  button,.btn,select{min-height:44px;padding:8px 12px;font-size:15px}
  .search button{min-height:40px;min-width:40px;flex:none}
  #zoomui{bottom:max(72px,calc(env(safe-area-inset-bottom) + 64px));gap:6px}
  #zoomui button{width:46px;height:46px;min-height:46px;font-size:20px;border-radius:12px;background:#ffff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .fold{width:32px;height:32px;margin-top:-16px;font-size:13px;min-height:32px}
  .side-r .fold{right:-16px}.side-l .fold{left:-16px}
  .node{user-select:none;-webkit-user-select:none;padding:9px 12px;font-size:14px}
  .node.l0{font-size:17px;padding:12px 18px}
  .node.l1{font-size:16px}
  aside{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;max-width:100%;height:auto;max-height:72dvh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.18);z-index:12;padding:8px 16px max(28px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  aside.hidden{display:none}
  .panel-close{display:flex;position:sticky;top:0;z-index:2;margin:-8px -6px 8px auto;width:44px;height:44px;min-height:44px;align-items:center;justify-content:center;border-radius:22px;background:#f5f7f9;font-size:20px;padding:0}
  .panel-handle{display:block;width:40px;height:5px;border-radius:3px;background:#cfd8dc;margin:4px auto 10px}
  #lightbox img{max-height:80dvh}
  #toast{top:auto;bottom:max(90px,calc(env(safe-area-inset-bottom) + 80px));left:12px;right:12px;transform:none;text-align:center}
}

</style>
</head>

<header>

"use strict";

та, Средняя дельта, Трицепс, Большая ягодичная","c":"#B71C1C"},{"t":"Вспомогательные / стабилизаторы (розовый): Верхняя трапеция, Передняя зубчатая, Поперечная мышца живота, Разгибатели спины (стабилизаторы поясницы), Бицепс бедра (задняя поверхность)","c":"#AD1457"},{"t":"Из конспекта / пояснение: Здесь переключение внимания: напрягли поясницу, выпрямились, напрягли руки (конспект)","c":"#37474F"},{"t":"Картинка: Наклон → подъём → руки к плечам → жим вверх","l":"ft_naklon_zhim.png","f":1,"img":"ft_naklon_zhim.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельно","l":"ft_naklon_zhim.png"},{"t":"Учебная схема: красный — основные мышцы, розовый — вспомогательные","c":"#555555"}]}]},{"t":"Заминка","c":"#1B5E20","f":1,"ch":[{"t":"Растяжка трицепса над головой","c":"#1B5E20","f":1,"a":[["Источник","дополнено по логике"]],"ch":[{"t":"Исходное положение: Стоя или сидя, одна рука вверх, согнуть локоть — ладонь к лопатке."},{"t":"Что делать: Второй рукой мягко потянуть локоть назад-к голове. 20–30 сек каждая рука."},{"t":"Какие мышцы тянем: Трицепс, широчайшая, задняя поверхность плеча.","c":"#1B5E20"},{"t":"Осторожно: Голову не наклонять вперёд, поясницу не прогибать.","c":"#BF360C"}]}]}]},{"t":"Наклон с гантелями у плеч + разгибание/сгибание рук","f":1,"a":[["Источник","конспект (мышцы дополнены)"]],"ch":[{"t":"Мышцы","c":"#B71C1C","f":1,"ch":[{"t":"Основные (красный): Трицепс, Бицепс бедра (задняя поверхность), Большая ягодичная","c":"#B71C1C"},{"t":"Вспомогательные / стабилизаторы (розовый): Бицепс плеча, Разгибатели спины (стабилизаторы поясницы), Задняя дельта, Поперечная мышца живота","c":"#AD1457"},{"t":"Из конспекта / пояснение: Сгибание прямо или по диагонали, локти прижаты к рёбрам или чуть выше; подвижные локти — работает длинная головка бицепса","c":"#37474F"},{"t":"Картинка: Наклон с гантелями у плеч + разгибание/сгибание рук","l":"ft_naklon_razgibanie.png","f":1,"img":"ft_naklon_razgibanie.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельн ются почти все мышечные цепи, кроме спиральной (нет скручивания) (конспект)","c":"#37474F"},{"t":"Картинка: «Колка дров»: мах гантелью между ног и вверх (не для новичков)","l":"ft_naklon_kolka.png","f":1,"img":"ft_naklon_kolka.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельно","l":"ft_naklon_kolka.png"},{"t":"Учебная схема: красный — основные мышцы, розовый — вспомогательные","c":"#555555"}]}]},{"t":"Заминка","c":"#1B5E20","f":1,"ch":[{"t":"Поза голубя с кирпичиками","c":"#1B5E20","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Исходное положение: Руками опираемся на кирпичики, спина прямая; одна нога согнута перед собой (голень впереди, стопа ближе к кирпичикам или между ними), вторая вытянута назад."},{"t":"Что делать: Опускать таз к полу, пока не почувствуется натяжение в ягодице передней ноги. Держать 30–60 сек, дышать; поменять сторону."},{"t":"Какие мышцы тянем: Большая и средняя ягодичные, грушевидная, мышцы поясницы (по конспекту — после приседаний и наклонов).","c":"#1B5E20"},{"t":"Осторожно: Колено передней ноги не должно болеть: при дискомфорте — выше опора под таз или вариант лёжа «нога на ногу».","c":"#BF360C"}]}]}]},{"t":"Наклон на одной ноге + тяга/подъём противоположной рукой","f":1,"a":[["Источник","конспект (мышцы дополнены)"]],"ch":[{"t":"Мышцы","c":"#B71C1C","f":1,"ch":[{"t":"Основные (красный): Большая ягодичная (опорная нога), Бицепс бедра (задняя поверхность) (опорная нога), Широчайшая мышца спины, Средняя трапеция и ромбовидные","c":"#B71C1C"},{"t":"Вспомогательные / стабилизаторы (розовый): Средняя ягодичная (опорная нога), Разгибатели спины (стабилизаторы поясницы), Косые мышцы живота, Бицепс плеча, Мышцы стопы и голеностопа (опорная нога)","c":"#AD1457"},{"t":"Из конспекта / пояснение: Диагональное напряжение от правого ТБС до левого плечевого сустава — включение мышц-разгибателей (конспект)","c":"#37474F"},{"t":"Картинка: Наклон на одной ноге + тяга/подъём противоположной рукой","l":"ft_naklon_1noga_ruka.png","f":1,"img":"ft_naklon_1noga_ruka.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельно","l":"ft_naklon_1noga_ruka.png"},{"t":"Учебная схема: красный — основные мышцы, розовый — вспомогательные","c":"#555555"}]}]},{"t":"Заминка","c":"#1B5E20","f":1,"ch":[{"t":"МФР ягодиц мячом в позе краба","c":"#1B5E20","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Исходное положение: Сидя на полу, руки сзади, мяч под ягодицей (поза краба)."},{"t":"Что делать: Медленно прокатывать ягодицу 1–2 мин, на плотных участках задержаться и подышать. Для усиления — закинуть ногу на ногу щиколоткой."},{"t":"Какие мышцы тянем: Большая и средняя ягодичные, грушевидная, напрягатель широкой фасции (сбоку).","c":"#1B5E20"},{"t":"Осторожно: Давление терпимое, без острой боли; не катать по кости и седалищному нерву.","c":"#BF360C"}]}]}]},{"t":"Статичный наклон на одной ноге с резинкой (выпрямление или тяга к тазу)","f":1,"a":[["Источник","конспект (мышцы дополнены)"]],"ch":[{"t":"Мышцы","c":"#B71C1C","f":1,"ch":[{"t":"Основные (красный): Большая ягодичная (опорная нога), Разгибатели спины (стабилизаторы поясницы), Широчайшая мышца спины","c":"#B71C1C"},{"t":"Вспомогательные / стабилизаторы (розовый): Бицепс бедра (задняя поверхность) (опорная нога), Средняя трапеция и ромбовидные, Бицепс плеча, Мышцы стопы и голеностопа (опорная нога)","c":"#AD1457"},{"t":"Из конспекта / пояснение: С резинкой в статике — ягодичная и поясничная (конспект)","c":"#37474F"},{"t":"Картинка: Статичный наклон на одной ноге с резинкой (выпрямление или тяга к тазу)","l":"ft_naklon_rezinka.png","f":1,"img":"ft_naklon_rezinka.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельно","l":"ft_naklon_rezinka.png"},{"t":"Учебная схема: красный — основные мышцы, розовый — вспомогательные","c":"#555555"}]}]},{"t":"Заминка","c":"#1B5E20","f":1,"ch":[{"t":"Поза голубя с кирпичиками","c":"#1B5E20","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Исходное положение: Руками опираемся на кирпичики, спина прямая; одна нога согнута перед со ой линии с туловищем"},{"t":"Пальцы смотрят вперёд, руки на ширине плеч"}]},{"t":"Боковая на локте (упрощённая)","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Упор на согнутую руку боком, ноги согнуты в коленях"},{"t":"Таз приподнят: ноги, попа и голова на одном уровне"},{"t":"Грудная клетка не проваливается к руке — держим выпрямленно"}]},{"t":"Стандартная на прямых руках","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Ладони под плечами, пальцы вперёд, отшаг ногами"},{"t":"СЛЕДИМ ЗА ПОЯСНИЦЕЙ: не проваливается вниз"},{"t":"Таз не поднимается вверх — тело одной линией"}]},{"t":"На локтях","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Следим за грудным отделом и поясницей"},{"t":"Подтягиваем внутренние органы (живот)"}]},{"t":"Ошибки","c":"#BF360C","f":1,"a":[["Источник","конспект"]],"ch":[{"t":"Провал поясницы","c":"#BF360C"},{"t":"Таз вверх «домиком»","c":"#BF360C"},{"t":"Грудная клетка проваливается к опорной руке (боковая)","c":"#BF360C"},{"t":"С гантелями — уровень «супер продвинутый», не всегда терапия","c":"#BF360C"}]}]}]},{"t":"Скручивание","c":"#AD1457","bg":"#FCE4EC","s":"left","f":1,"ec":"#AD1457","ch":[{"t":"Вариации (13)","c":"#AD1457","f":1,"ch":[{"t":"Скручивание на спине: руки за голову, подъём до лопаток","f":1,"a":[["Источник","конспект (мышцы дополнены)"]],"ch":[{"t":"Мышцы","c":"#B71C1C","f":1,"ch":[{"t":"Основные (красный): Прямая мышца живота","c":"#B71C1C"},{"t":"Вспомогательные / стабилизаторы (розовый): Косые мышцы живота, Поперечная мышца живота, Кивательная мышца шеи, Подвздошно-поясничная мышца","c":"#AD1457"},{"t":"Из конспекта / пояснение: Прямая мышца живота — сгибание (конспект)","c":"#37474F"},{"t":"Картинка: Скручивание на спине: руки за голову, подъём до лопаток","l":"ft_skruch_klassika.png","f":1,"img":"ft_skruch_klassika.png","iw":1632,"ih":1000,"ch":[{"t":"Открыть картинку отдельно","l":"ft_skruch_klassika.png"},{"t":"Учебная схема: красный — основные мышцы, розовый — вспомогательные","c":"#555555"}]}]},{"t":"Заминка","c":" // ---------- actions ----------
function refresh(n){const d=els.get(n);if(d)fillEl(n,d);}
function setOpen(n,v,anchor){if(!n.ch.length||n.open===v)return;n.open=v;refresh(n);layout(anchor||n);}
function toggle(n){if(n===root)return;setOpen(n,!n.open);}
function select(n,focus){
  const o=els.get(sel);if(o)o.classList.remove("sel");
  sel=n;const d=els.get(n);if(d){d.classList.add("sel");if(focus!==false&&!isPhone())d.focus({preventScroll:true});}
  renderPanel();
  syncPeek();
}
function reveal(n){let p=n.p,changed=[];while(p){if(!p.open){p.open=true;changed.push(p);}p=p.p;}changed.forEach(refresh);return changed.length>0;}
function setAll(fn){for(const n of nodes){const v=n===root?true:fn(n);if(n.open!==v){n.open=v;refresh(n);}}layout();if(!lastVis.has(sel))select(root,false);fit(null,1);
  if(scale<0.2){scale=0.6;const t=sel.lv>=1?sel:root;tx=vp.clientWidth/2-(t.x+t.w/2)*scale;ty=vp.clientHeight/2-(t.y+t.h/2)*scale;applyView();toast(isPhone()?"Карта большая: один палец — двигать, щипок — масштаб, ⤢ — вся карта":"Карта большая: колёсико — прокрутка, Ctrl+колёсико — масштаб, ⤢ — вся карта");}}
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";vp.appendChild(t);}t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),3500);}
$("#expandAll").onclick=()=>setAll(()=>true);
$("#collapseAll").onclick=()=>{setAll(n=>INIT.get(n)&&n.lv===0);};
$("#level").onchange=e=>{const L=+e.target.value;if(!L)return;setAll(n=>n.lv<L);e.target.value="";};
function setPanelOpen(on){panel.classList.toggle("hidden",!on);panel.style.transform="";$("#togglePanel").setAttribute("aria-pressed",!!on);syncPeek();}
function syncPeek(){
  const peek=$("#peek");if(!peek)return;
  const phone=isPhone(),open=!panel.classList.contains("hidden");
  if(phone&&!open){peek.hidden=false;peek.classList.add("on");$("#peektitle").textContent=sel?sel.t:"";$("#peekbtn").setAttribute("aria-expanded","false");}
  else{peek.hidden=true;peek.classList.remove("on");}
}
$("#togglePanel").onclick=()=>setPanelOpen(panel.classList.contains("hidden"));
$("#peekbtn").onclick=()=>setPanelOpen(true);
// ---------- panel ----------
function pathOf(n){const a=[];while(n){a.unshift(n);n=n.p;}return a;}
function count(n){let c=0;(function w(x){x.ch.forEach(y=>{c++;w(y);});})(n);return c;}
function deep(n){
  return `<ul class="deep">${n.ch.map(c=>{let li=`<a data-go="${c.id}" style="${c.c?"color:"+c.c:""}">${fmtText(c)}</a>`;
    if(c.a)li+=c.a.map(a=>` <span class="srcp">${esc(a[0])}: ${hl(a[1])}</span>`).join("");
    if(c.img)li+=`<img src="${esc(c.img)}" alt="${esc(c.t)}" data-big="${esc(c.img)}" loading="lazy">`;
    if(c.l&&!c.img)li+=` <a href="${esc(c.l)}" target="_blank" rel="noopener">↗</a>`;
    if(c.ch.length)li+=deep(c);return `<li>${li}</li>`;}).join("")}</ul>`;
}
function isPhone(){return window.matchMedia("(max-width:920px), ((pointer:coarse) and (max-width:1180px))").matches;}
function helpHTML(){return `<div class="help"><h3>Как пользоваться</h3><ul>
<li>Это копия карты Freeplane «Майнд-карта функциональный тренинг.mm» для браузера (снимок файла от 12.11.2026 15:34; если поменяешь карту во Freeplane, HTML сам не обновится).</li>
<li><b>Нажми на узел</b> — развернуть или свернуть ветку. Цифра в кружке — сколько веток внутри.</li>
<li><b>На телефоне:</b> один палец двигает карту (можно начинать с узла), щипок двумя пальцами меняет масштаб. Кнопки + / − / ⤢ слева внизу. Подробности выбранного узла — снизу, кнопка «Подробнее» или «Панель».</li>
<li><b>На компьютере:</b> перетаскивание фона двигает карту; колёсико — прокрутка, Ctrl + колёсико — масштаб; кнопка ⤢ — вся карта.</li>
<li><b>Поиск</b> разворачивает и подсвечивает найденное; <kbd>Enter</kbd> — следующее совпадение.</li>
<li>В панели — подробности выбранного узла: путь, источник, картинка, список вложенных пунктов.</li>
<li>Клавиши: <kbd>←</kbd><kbd>→</kbd> вглубь/назад, <kbd>↑</kbd><kbd>↓</kbd> соседние, <kbd>Enter</kbd>/<kbd>Пробел</kbd> развернуть, <kbd>/</kbd> поиск, <kbd>+</kbd><kbd>−</kbd><kbd>0</kbd> масштаб, <kbd>Esc</kbd> сброс поиска.</li>
<li>Схема: паттерн → «Вариации» и «Отстройка тела»; вариация → «Мышцы» (список + картинка) и «Заминка».</li><li>Красный — основные мышцы, розовый — вспомогательные, зелёный — заминка, оранжевый — осторожно/ошибки. Картинки — учебные схемы; нажми на картинку, чтобы увеличить. Файлы ft_*.png должны лежать в той же папке, что и этот файл.</li>
</ul></div>`;}
function renderPanel(){
  const n=sel,path=pathOf(n);let h="";
  h+=`<div class="panel-handle" aria-hidden="true"></div>`;
  h+=`<button type="button" class="panel-close" data-act="close" aria-label="Закрыть панель">✕</button>`;
  h+=`<div class="crumbs">${path.slice(0,-1).map(p=>`<a data-go="${p.id}">${esc(p.t.length>40?p.t.slice(0,38)+"…":p.t)}</a>`).join(" › ")}</div>`;
  h+=`<h2 style="color:${n.lv>=1?(n.c&&n.lv>=2?n.c:n.br.c):"inherit"}">${fmtText(n)}</h2>`;
  (n.sub||[]).forEach(s=>h+=`<p>${hl(s)}</p>`);
  if(n.a)h+=`<table>${n.a.map(a=>`<tr><td><b>${esc(a[0])}</b></td><td>${hl(a[1])}</td></tr>`).join("")}</table>`;
  if(n.img)h+=`<img src="${esc(n.img)}" alt="${esc(n.t)}" data-big="${esc(n.img)}">`;
  if(n.gif)h+=`<img src="${esc(n.gif)}" alt="${esc(n.t)}" data-big="${esc(n.gif)}">`;
  if(n.l)h+=`<p><a href="${esc(n.l)}" target="_blank" rel="noopener">↗ Открыть ${esc(n.l)} отдельно</a></p>`;
  if(n.ch.length){
    h+=`<div class="acts"><button data-act="tog">${n.open?"Свернуть":"Развернуть"} ветку</button><button data-act="all">Развернуть всё внутри (${count(n)})</button><button data-act="focus">Показать на карте</button></div>`;
    if(n.lv>=3&&count(n)<=80){h+=`<b>Подробно:</b>`+deep(n);}else
    h+=`<b>Внутри (${n.ch.length}):</b><ul>${n.ch.map(c=>`<li><a data-go="${c.id}" style="${c.c&&c.lv>=2?"color:"+c.c:""}">${fmtText(c)}</a>${c.ch.length?` <span style="color:#90a4ae">(${count(c)})</span>`:""}</li>`).join("")}</ul>`;
  }
  if(n===root||n.lv===0)h+=helpHTML();
  panel.innerHTML=h;
}
panel.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){const n=byId.get(g.dataset.go);if(reveal(n))layout(sel);select(n);ensureVisible(n,true);return;}
  const im=e.target.closest("img[data-big]");if(im){openLB(im.dataset.big,im.alt);return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="close"){setPanelOpen(false);return;}
  const n=sel;
  if(a.dataset.act==="tog")toggle(n);
  if(a.dataset.act==="all"){(function w(x){if(x.ch.length&&!x.open){x.open=true;refresh(x);}x.ch.forEach(w);})(n);layout(n);}
  if(a.dataset.act==="focus"){ensureVisible(n,true);if(isPhone())setPanelOpen(false);}
  renderPanel();
});
let pdrag=null;
panel.addEventListener("touchstart",e=>{
  if(!isPhone())return;
  const y=e.touches[0].clientY,r=panel.getBoundingClientRect();
  if(y-r.top<64)pdrag={y,t0:performance.now()};
},{passive:true});
panel.addEventListener("touchmove",e=>{
  if(!pdrag)return;
  const dy=e.touches[0].clientY-pdrag.y;
  if(dy>0)panel.style.transform=`translateY(${dy}px)`;
},{passive:true});
panel.addEventListener("touchend",e=>{
  if(!pdrag)return;
  const dy=e.changedTouches[0].clientY-pdrag.y;
  panel.style.transform="";
  if(dy>80)setPanelOpen(false);
  pdrag=null;
});
// ---------- lightbox ----------
const lb=$("#lightbox");
function openLB(src,cap){lb.querySelector("img").src=src;lb.querySelector("div").textContent=cap+" — клик или Esc, чтобы закрыть";lb.classList.add("on");}
lb.onclick=()=>lb.classList.remove("on");
// ---------- map interactions ----------
const ptrs=new Map();
let drag=null,pinch=null,moved=false,suppressClick=false,gest=null,tapEl=null;
function ptrMid(){const a=[...ptrs.values()];return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
function ptrDist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
function loc(x,y){const r=vp.getBoundingClientRect();return {x:x-r.left,y:y-r.top};}
function activateNode(el){
  const d=el&&el.closest&&el.closest(".node");if(!d)return false;
  const n=byId.get(d.dataset.id);if(!n)return false;
  if(el.closest&&el.closest("a"))return false;
  if(el.closest&&el.closest("img.pic")){select(n);openLB(el.closest("img.pic").getAttribute("src"),n.t);return true;}
  toggle(n);select(n);if(n.open&&n.ch.length)ensureVisible(n.ch[n.ch.length-1]),ensureVisible(n);
  return true;
}
vp.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  if(e.target.closest("#zoomui"))return;
  const onNode=e.target.closest(".node");
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const m=ptrMid(),L=loc(m.x,m.y);
    pinch={d:ptrDist(),scale,tx,ty,lx:L.x,ly:L.y};
    drag=null;moved=true;suppressClick=true;tapEl=null;
    e.preventDefault();
    return;
  }
  // Мышь по узлу — как раньше: не начинаем перетаскивание, сработает обычный клик
  if(e.pointerType==="mouse"&&onNode){
    drag=null;tapEl=null;moved=false;suppressClick=false;
    ptrs.delete(e.pointerId);
    return;
  }
  drag={x:e.clientX,y:e.clientY,tx,ty};
  moved=false;suppressClick=false;
  tapEl=e.target;
  try{vp.setPointerCapture(e.pointerId);}catch(_){}
},{passive:false});
vp.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const m=ptrMid(),L=loc(m.x,m.y);
    const ns=Math.max(0.04,Math.min(3,pinch.scale*(ptrDist()/(pinch.d||1))));
    const wx=(pinch.lx-pinch.tx)/pinch.scale,wy=(pinch.ly-pinch.ty)/pinch.scale;
    scale=ns;tx=L.x-wx*ns;ty=L.y-wy*ns;applyView();markUser();
    e.preventDefault();return;
  }
  if(drag&&!pinch){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    const th=e.pointerType==="mouse"?6:16;
    if(Math.hypot(dx,dy)>th){moved=true;suppressClick=true;tapEl=null;vp.classList.add("drag");markUser();}
    if(moved){tx=drag.tx+dx;ty=drag.ty+dy;applyView();e.preventDefault();}
  }
},{passive:false});
function endPtr(e){
  const isTap=!moved&&!pinch&&!!tapEl&&!!drag&&e.pointerType!=="mouse"&&e.type==="pointerup";
  const el=tapEl;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){
    drag=null;vp.classList.remove("drag");tapEl=null;
    if(isTap){
      activateNode(el);
      suppressClick=true; // если следом придёт click — не переключать ветку второй раз
    }
    setTimeout(()=>{suppressClick=false;moved=false;},80);
  }else if(ptrs.size===1){
    const p=[...ptrs.values()][0];
    drag={x:p.x,y:p.y,tx,ty};
    tapEl=null;
  }
}
vp.addEventListener("pointerup",endPtr);
vp.addEventListener("pointercancel",e=>{tapEl=null;endPtr(e);});
// Safari pinch: не глушим обычное нажатие, пока нет реального щипка
vp.addEventListener("gesturestart",e=>{
  e.preventDefault();
  if(pinch)return;
  const L=loc(e.clientX,e.clientY);
  gest={scale,tx,ty,lx:L.x,ly:L.y};
},{passive:false});
vp.addEventListener("gesturechange",e=>{
  e.preventDefault();
  if(!gest||pinch)return;
  if(Math.abs(e.scale-1)<0.03)return;
  const L=loc(e.clientX,e.clientY);
  const ns=Math.max(0.04,Math.min(3,gest.scale*e.scale));
  const wx=(gest.lx-gest.tx)/gest.scale,wy=(gest.ly-gest.ty)/gest.scale;
  scale=ns;tx=L.x-wx*ns;ty=L.y-wy*ns;applyView();
  moved=true;suppressClick=true;tapEl=null;markUser();
},{passive:false});
vp.addEventListener("gestureend",e=>{e.preventDefault();gest=null;},{passive:false});
function zoomAt(f,cx,cy){const ns=Math.max(0.04,Math.min(3,scale*f));const r=vp.getBoundingClientRect();cx=(cx===undefined?r.width/2:cx-r.left);cy=(cy===undefined?r.height/2:cy-r.top);tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;applyView();markUser();}
vp.addEventListener("wheel",e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){zoomAt(Math.exp(-e.deltaY*0.0022),e.clientX,e.clientY);}else{const k=e.deltaMode===1?18:1;tx-=(e.shiftKey?e.deltaY:e.deltaX)*k;ty-=(e.shiftKey?0:e.deltaY)*k;applyView();}},{passive:false});
$("#zin").onclick=()=>zoomAt(1.25);$("#zout").onclick=()=>zoomAt(0.8);$("#zfit").onclick=()=>{userView=false;fit(null,1);};
world.addEventListener("click",e=>{
  if(moved||suppressClick){e.preventDefault();e.stopPropagation();return;}
  const d=e.target.closest(".node");if(!d)return;const n=byId.get(d.dataset.id);
  if(e.target.closest("a"))return;
  if(e.target.closest("img.pic")){select(n);openLB(e.target.getAttribute("src"),n.t);return;}
  const s=window.getSelection();if(s&&s.toString().length>2&&!e.target.closest(".fold")&&!isPhone())return;
  toggle(n);select(n);if(n.open&&n.ch.length)ensureVisible(n.ch[n.ch.length-1]),ensureVisible(n);
});
world.addEventListener("load",e=>{if(e.target.tagName==="IMG"){const d=e.target.closest(".node");if(d){const n=byId.get(d.dataset.id);if(n&&Math.abs(d.offsetHeight-n.h)>1)layout(sel);}}},true);
// keyboard
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("on")){if(e.key==="Escape")lb.classList.remove("on");return;}
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.target===qi){
    if(e.key==="Enter"){e.preventDefault();step(e.shiftKey?-1:1);}
    else if(e.key==="Escape"){qi.value="";runSearch();els.get(sel)&&els.get(sel).focus({preventScroll:true});}
    return;}
  if(tag==="input"||tag==="select"||tag==="textarea")return;
  if((e.key==="/"&&!e.ctrlKey)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f")){e.preventDefault();qi.focus();qi.select();return;}
  if(tag==="button"||tag==="a"){if(e.key!=="Escape")return;}
  const n=sel;let t=null;
  const into=x=>{if(!x.ch.length)return null;if(!x.open){setOpen(x,true);return x;}return x.ch[0];};
  switch(e.key){
    case "ArrowRight":t=n===root?root.ch.find(c=>c.side>0):(n.side>0?into(n):n.p);break;
    case "ArrowLeft":t=n===root?root.ch.find(c=>c.side<0):(n.side<0?into(n):n.p);break;
    case "ArrowDown":case "ArrowUp":{if(!n.p)break;let sib=n.p.ch;if(n.p===root)sib=sib.filter(c=>c.side===n.side);const i=sib.indexOf(n)+(e.key==="ArrowDown"?1:-1);t=sib[i]||null;break;}
    case "Enter":case " ":toggle(n);t=n;break;
    case "Home":t=root;break;
    case "+":case "=":zoomAt(1.2);break;
    case "-":case "_":zoomAt(1/1.2);break;
    case "0":fit(null,1);break;
    case "Escape":if(query){qi.value="";runSearch();}break;
    default:return;
  }
  e.preventDefault();
  if(t){select(t);ensureVisible(t);}
});
// ---------- search ----------
const qi=$("#q"),qc=$("#qcnt");let qtimer;
qi.addEventListener("input",()=>{clearTimeout(qtimer);qtimer=setTimeout(runSearch,220);});
$("#qnext").onclick=()=>step(1);$("#qprev").onclick=()=>step(-1);
function runSearch(){
  const prev=new Set(hits);query=norm(qi.value.trim());
  hits=query.length>=2?nodes.filter(n=>n.search.includes(query)):[];
  hitPos=-1;hitSet=new Set(hits);
  let changed=false;hits.forEach(h=>{if(reveal(h))changed=true;});
  // re-render text (highlights) for affected nodes
  new Set([...prev,...hits]).forEach(refresh);
  if(changed||prev.size||hits.length)layout(sel);
  for(const [n,d] of els){d.classList.toggle("hit",hitSet.has(n));d.classList.remove("cur");d.classList.toggle("dim",query.length>=2&&!hitSet.has(n));}
  qc.textContent=query.length>=2?(hits.length?`${hits.length} найд.`:"нет"):"";
  if(hits.length)step(1);
  renderPanel();
}
function step(dir){
  if(!hits.length)return;const o=els.get(hits[hitPos]);if(o)o.classList.remove("cur");
  hitPos=(hitPos+dir+hits.length)%hits.length;const n=hits[hitPos];
  select(n,false);const d=els.get(n);if(d)d.classList.add("cur");
  ensureVisible(n,true);qc.textContent=`${hitPos+1} из ${hits.length}`;
}
// ---------- init ----------
if(isPhone()){panel.classList.add("hidden");$("#togglePanel").setAttribute("aria-pressed","false");const mt=$("#moreTools");if(mt)mt.hidden=false;}
$("#moreTools").onclick=()=>{const h=document.querySelector("header");const on=h.classList.toggle("more-open");$("#moreTools").setAttribute("aria-expanded",on);$("#moreTools").textContent=on?"Закрыть":"Ещё";};
function refitIfPristine(){if(userView)return;layout();fit(null,1);}
layout();fit(null,1);select(root,false);syncPeek();
requestAnimationFrame(refitIfPristine);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refitIfPristine);
window.addEventListener("resize",()=>{syncPeek();refitIfPristine();});
window.addEventListener("orientationchange",()=>{setTimeout(()=>{syncPeek();if(userView&&sel)ensureVisible(sel,false);else refitIfPristine();},250);});
if(window.visualViewport)visualViewport.addEventListener("resize",()=>{if(!userView)refitIfPristine();});
window.__mindmap={nodes,root,layout,setAll,count:()=>nodes.length,visible:()=>lastVis.size};
})();
</script>
</body>
</html>
